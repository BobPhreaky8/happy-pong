```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Happy Pong - 10 Instances</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #111;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #launcher {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111;
            color: white;
            z-index: 100;
        }

        #launcher h1 {
            margin-bottom: 20px;
        }

        #startButton {
            padding: 18px 35px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #games {
            display: none;
            width: 100vw;
            height: 100vh;
            overflow: auto;
            padding: 5px;
            box-sizing: border-box;

            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 5px;
        }

        .game {
            width: 100%;
            height: 100%;
            min-height: 150px;
            border: 1px solid #444;
            background: #080818;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>

<body>

<div id="launcher">
    <h1>Happy Face Pong</h1>
    <button id="startButton">
        START 10 GAMES
    </button>
</div>

<div id="games"></div>

<script>
"use strict";

const gameURL =
    "https://bobphreaky8.github.io/happy-pong/";

const launcher = document.getElementById("launcher");
const button = document.getElementById("startButton");
const games = document.getElementById("games");

button.addEventListener("click", function () {

    launcher.style.display = "none";
    games.style.display = "grid";

    // Create 10 separate game instances.
    for (let i = 0; i < 10; i++) {

        const container = document.createElement("div");
        container.className = "game";

        const iframe = document.createElement("iframe");

        iframe.src = gameURL;

        iframe.title = "Happy Pong Game " + (i + 1);

        container.appendChild(iframe);
        games.appendChild(container);
    }
});
</script>

</body>
</html>
```
