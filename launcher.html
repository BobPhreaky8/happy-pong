        body {
            margin: 0;
            min-height: 100vh;
            display: flex;

            padding: 18px 30px;
            font-size: 20px;
            font-weight: bold;

            cursor: pointer;
        }
    </style>

<body>

<div>
    <h1>Happy Face Pong</h1>
    <p>Open 10 game windows</p>

    <button onclick="openGames()">
        OPEN 10 GAMES
    </button>
</div>

<script>
"use strict";

const gameURL = "https://bobphreaky8.github.io/happy-pong/";

function openGames() {

    // Try to open 10 separate game windows.
    for (let i = 0; i < 10; i++) {
        window.open(
            gameURL,
            "_blank"
        );
    }
}
</script>

</body>
