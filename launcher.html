```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Pong Launcher</title>
</head>

<body>

<script>
"use strict";

const gameURL = "https://bobphreaky8.github.io/happy-pong/";

// Automatically attempt to open 10 game windows.
window.addEventListener("load", function () {
    for (let i = 0; i < 10; i++) {
        window.open(gameURL, "_blank");
    }
});
</script>

</body>
</html>
